[package]
name = "duedate"
version = "0.1.0"
description = "Desktop countdown gadget"
authors = ["Allen"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "duedate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
